[package]
name = "log-stack"
version = "1.0.0"
description = "Daily Logger"
authors = ["you"]
edition = "2021"

[lib]
name = "daily_logger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "log-stack"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redb = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
once_cell = "1"

[profile.release]
panic = "abort"
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true
