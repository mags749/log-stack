name: "Log stack build"

on:
  push:
    tags:
      - "v*" # Triggers on version tags (e.g. v1.0.0)
  workflow_dispatch: # Allows manual trigger from Actions tab

env:
  CARGO_INCREMENTAL: 0

# Setting permissions globally fixes "Resource not accessible" on ALL jobs
permissions:
  contents: write

jobs:
  build-app:
    name: "Build (${{ matrix.platform }})"
    runs-on: ${{ matrix.platform }}
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            args: ""
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Log Stack ${{ github.ref_name }}"
          args: ${{ matrix.args }}
          releaseBody: 'See the assets to download this version.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-builds-${{ matrix.platform }}
          retention-days: 1
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/latest.json
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/latest.json
          if-no-files-found: warn

  publish-release:
    name: "Publish GitHub Release"
    needs: build-app
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-builds-*
          path: ./release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: "Log Stack ${{ github.ref_name }}"
          body: |
                      ## Log Stack ${{ github.ref_name }}

                      ### 📦 Downloads
                      * **macOS**: `.dmg` (Apple Silicon)
                      * **Windows**: `.msi` / `.exe`
                      * **Linux**: `.AppImage` / `.deb`

                      ---
                      *Automated build created by GitHub Actions.*
          draft: false
          prerelease: false
          files: ./release-assets/**/*
