name: "Log stack build"

on:
  push:
    tags:
      - "v*" # Triggers on version tags (e.g. v1.0.0)
  workflow_dispatch: # Allows manual trigger from Actions tab

env:
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: sccache

# Setting permissions globally fixes "Resource not accessible" on ALL jobs
permissions:
  contents: write

jobs:
  build-and-publish:
    name: "Build & Publish (${{ matrix.platform }})"
    runs-on: ${{ matrix.platform }}
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            args: ""
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Install sccache for fast Rust object caching across runs
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v2

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build and Publish Log Stack App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Log Stack ${{ github.ref_name }}"
          args: ${{ matrix.args }}
          releaseBody: |
            ## Log Stack ${{ github.ref_name }}

            ### 📦 Downloads
            * **macOS**: `.dmg` / `.app.tar.gz`
            * **Windows**: `.msi` / `.exe`
            * **Linux**: `.AppImage` / `.deb`

            ---
            *Automated release generated by GitHub Actions.*
          releaseDraft: false
          prerelease: false
